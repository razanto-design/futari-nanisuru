<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff7ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ふたりでなにする？">
<title>ふたりでなにする？</title>
<style>
:root{--bg:#fff7ef;--card:#fff;--ink:#292522;--muted:#746d67;--accent:#ff7657;--line:#eadfd6}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#fff7ef,#fffdf9);color:var(--ink)}
.wrap{max-width:520px;margin:auto;padding:28px 18px 42px}.hero{text-align:center;margin:12px 0 22px}.hero .emoji{font-size:48px}.hero h1{font-size:30px;margin:5px 0}.hero p{color:var(--muted);margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;margin:13px 0;box-shadow:0 8px 25px #7b5b4020}
label{font-weight:700;display:block;margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;font-size:14px}.chip.active{background:#292522;color:#fff;border-color:#292522}
button.main{width:100%;border:0;border-radius:18px;padding:17px;background:var(--accent);color:white;font-weight:800;font-size:18px;margin-top:8px;box-shadow:0 8px 18px #ff765744}.result{display:none;text-align:center}.result .big{font-size:54px}.result h2{font-size:25px;margin:5px}.result p{color:var(--muted);line-height:1.7}.actions{display:flex;gap:8px}.actions button{flex:1;padding:12px;border-radius:14px;border:1px solid var(--line);background:white;font-weight:700}small{display:block;text-align:center;color:var(--muted);margin-top:18px}
</style></head><body><main class="wrap">
<section class="hero"><div class="emoji">👫</div><h1>ふたりでなにする？</h1><p>迷った休日を、ちょっと楽しく。</p></section>
<div class="card"><label>💰 予算</label><div class="chips" data-key="budget"><button class="chip active" data-v="any">なんでも</button><button class="chip" data-v="0">ほぼ0円</button><button class="chip" data-v="1000">〜1,000円</button><button class="chip" data-v="3000">〜3,000円</button><button class="chip" data-v="more">ちょっと贅沢</button></div></div>
<div class="card"><label>⏰ 時間</label><div class="chips" data-key="time"><button class="chip active" data-v="any">なんでも</button><button class="chip" data-v="short">1〜2時間</button><button class="chip" data-v="half">半日</button><button class="chip" data-v="day">1日</button></div></div>
<div class="card"><label>🎈 気分</label><div class="chips" data-key="mood"><button class="chip active" data-v="any">なんでも</button><button class="chip" data-v="home">家</button><button class="chip" data-v="near">近場</button><button class="chip" data-v="drive">ドライブ</button><button class="chip" data-v="active">体を動かす</button></div></div>
<button class="main" id="go">🎲 今日なにする？</button>
<section class="card result" id="result"><div class="big" id="icon">☕</div><h2 id="title"></h2><p id="desc"></p><div class="actions"><button id="again">🔄 もう一回</button><button id="fav">♡ またやりたい</button></div></section><small>ふたりの休日ルーレット</small>
</main>
<script>
const ideas=[
["☕","コーヒー持って散歩","好きな飲み物を用意して、いつもと違う道を30分歩こう。","0","short","near"],
["📸","写真散歩","10枚ずつ撮って、帰ったら今日のベスト1を決める。","0","short","near"],
["🚗","目的地なしドライブ","曲を3曲聴く間だけ適当に走って、着いた場所の近くを探索。","1000","half","drive"],
["🥐","パン屋開拓ドライブ","行ったことのないパン屋を1軒探して、1個ずつ選ぶ。","3000","half","drive"],
["♨️","温泉＋帰りにアイス","近場の温泉へ。帰りに好きなアイスを1個ずつ。","3000","half","drive"],
["🎯","ダーツ対決","負けた方が飲み物をおごる、くらいの軽い勝負。","3000","short","active"],
["🏓","卓球","1時間だけ本気で勝負。","3000","short","active"],
["🎤","カラオケ","お互い3曲ずつ相手に歌ってほしい曲を選ぶ。","3000","half","near"],
["🍳","冷蔵庫料理チャレンジ","買い足しなしで一品作る。","0","short","home"],
["🥟","餃子づくり","変な形も含めて二人で楽しむ。","1000","half","home"],
["🎬","おうち映画館","部屋を暗くして、お菓子と飲み物を用意して一本観る。","1000","half","home"],
["🛒","知らないスーパー探索","普段行かない店で食べたことない物を1個ずつ選ぶ。","1000","short","near"],
["🎁","1000円プレゼント交換","別行動で相手に買う物を選んで交換。","1000","short","near"],
["🌇","夕日を見に行く","飲み物だけ持って景色のいい方向へドライブ。","0","short","drive"],
["🗺️","知らない町を歩く","行ったことのないエリアを30〜60分散策。","0","half","drive"],
["🎣","釣り・釣り堀","半日使ってのんびり遊ぶ。","more","half","drive"],
["🍜","ラーメン新規開拓","二人とも未訪問の一軒へ。","3000","short","near"],
["🧁","お菓子作り","クッキーやプリンなど簡単なものを一緒に。","1000","half","home"],
["🃏","トランプ5本勝負","勝った方が次の休日の行き先を決める。","0","short","home"],
["🛍️","リサイクルショップ探検","懐かしい物や面白い物を探す。","0","short","near"],
["🌲","一日ドライブ旅","朝だけ目的地を決めて寄り道は現地で決める。","more","day","drive"]];
const state={budget:"any",time:"any",mood:"any"};
document.querySelectorAll(".chips").forEach(g=>g.addEventListener("click",e=>{
 if(!e.target.classList.contains("chip"))return;
 [...g.children].forEach(x=>x.classList.remove("active")); e.target.classList.add("active"); state[g.dataset.key]=e.target.dataset.v;
}));
let current=null;
function pick(){
 let a=ideas.filter(x=>(state.budget==="any"||x[3]===state.budget)&&(state.time==="any"||x[4]===state.time)&&(state.mood==="any"||x[5]===state.mood));
 if(!a.length)a=ideas.filter(x=>(state.time==="any"||x[4]===state.time)&&(state.mood==="any"||x[5]===state.mood));
 if(!a.length)a=ideas;
 current=a[Math.floor(Math.random()*a.length)];
 document.getElementById("icon").textContent=current[0];document.getElementById("title").textContent=current[1];document.getElementById("desc").textContent=current[2];
 document.getElementById("result").style.display="block";document.getElementById("result").scrollIntoView({behavior:"smooth",block:"center"});
}
document.getElementById("go").onclick=pick;document.getElementById("again").onclick=pick;
document.getElementById("fav").onclick=()=>{
 if(!current)return;let f=JSON.parse(localStorage.getItem("coupleFavs")||"[]");if(!f.includes(current[1]))f.push(current[1]);
 localStorage.setItem("coupleFavs",JSON.stringify(f));const b=document.getElementById("fav");b.textContent="♥ 保存した！";setTimeout(()=>b.textContent="♡ またやりたい",1200);
};
</script></body></html>
